name: Deploy (GHCR + Azure VM)

# Entrega contínua:
#   1) Builda as imagens api/web nos runners do GitHub e publica no GHCR
#      (não builda na VM B2 — poupa CPU/RAM da instância).
#   2) Faz SSH na VM Azure, puxa as imagens e sobe (docker compose pull + up -d),
#      aplicando as migrations Prisma.
#
# Dispara no push para main e manualmente (workflow_dispatch).
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     IP/host da VM
#   DEPLOY_USER     usuário SSH (ex.: azureuser)
#   DEPLOY_SSH_KEY  chave PRIVADA SSH
#   DEPLOY_PORT     (opcional) porta SSH; padrão 22
#   DEPLOY_PATH     (opcional) caminho do repo na VM; padrão $HOME/dcmg
#   GHCR_USER       usuário GitHub p/ a VM logar no GHCR (ex.: Lca2001C)
#   GHCR_TOKEN      PAT com escopo read:packages (login do docker na VM)
# Sem DEPLOY_HOST, o job de deploy é PULADO (não falha).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE_API: ghcr.io/lca2001c/defesa-civil-api
  IMAGE_WEB: ghcr.io/lca2001c/defesa-civil-web

jobs:
  # ---------------------------------------------------------------------------
  # Build + push das imagens para o GitHub Container Registry (GHCR)
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & push imagens (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push — API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push — Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ---------------------------------------------------------------------------
  # Deploy na VM Azure: puxa as imagens e sobe (sem build na VM)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy na VM (pull + up)
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verificar secrets de deploy
        id: guard
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de deploy ausentes (DEPLOY_HOST). Pulando o deploy."
          fi

      - name: Deploy via SSH
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          envs: DEPLOY_PATH,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            # Login no GHCR para puxar imagens privadas (se públicas, é opcional).
            if [ -n "${GHCR_TOKEN}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi
            cd "${DEPLOY_PATH:-$HOME/dcmg}"
            echo "==> Atualizando arquivos de deploy (compose, migrations)"
            git fetch --all --prune
            git checkout main
            git pull --ff-only
            echo "==> Puxando imagens do GHCR e subindo"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            echo "==> Aplicando migrations Prisma"
            docker compose -f docker-compose.prod.yml exec -T -w /app/apps/api api \
              /app/node_modules/.bin/prisma migrate deploy
            echo "==> Limpeza"
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
