name: Deploy (Azure Container Apps)

# CI/CD para o Azure Container Apps (ACA) — substitui o antigo deploy na VM.
#
# Fluxo:
#   1) az acr build: constrói `dcmg-api` e `dcmg-web` NA NUVEM (ACR Tasks), sem
#      Docker no runner. Tag = git SHA (imutável/rastreável) + "latest".
#   2) az containerapp update --container-name <c> --image <img>: troca APENAS a
#      imagem de cada container (nova revisão que puxa a imagem nova).
#      Usamos --image de propósito (NÃO --yaml): o `--yaml` trata o template como
#      REPLACE e a serialização do CLI pode dropar configuration.registries[].identity,
#      quebrando o AcrPull (microsoft/azure-container-apps#524). O `--image` não
#      toca em secrets/identidade/registries/env — só na imagem. (Efeito: 2
#      revisões por deploy; em Single mode o cutover é sem downtime.)
#
# AUTENTICAÇÃO: OIDC (federated credentials) — sem senha de service principal.
#
# Setup no Azure (uma vez só):
#   SUB_ID=$(az account show --query id -o tsv)
#   TENANT_ID=$(az account show --query tenantId -o tsv)
#   # 1) App registration + SP com Contributor no RG (roda o containerapp update):
#   APP_ID=$(az ad sp create-for-rbac --name "gh-dcmg-deploy" \
#     --role Contributor \
#     --scopes /subscriptions/$SUB_ID/resourceGroups/rg-dcmg-prod \
#     --query appId -o tsv)
#   # 2) AcrPush no registry (push do az acr build):
#   az role assignment create --assignee "$APP_ID" --role AcrPush \
#     --scope $(az acr show -n defesacivil --query id -o tsv)
#   # 3) Federated credential ligando o SP a este repo/branch (cobre push e
#   #    workflow_dispatch na main):
#   az ad app federated-credential create --id "$APP_ID" --parameters '{
#     "name":"gh-main",
#     "issuer":"https://token.actions.githubusercontent.com",
#     "subject":"repo:Lca2001C/Defesa-civil:ref:refs/heads/main",
#     "audiences":["api://AzureADTokenExchange"]
#   }'
#
# Secrets do GitHub (Settings > Secrets and variables > Actions) — são IDs, não
# senhas, mas ficam como secret por convenção:
#   AZURE_CLIENT_ID        = $APP_ID
#   AZURE_TENANT_ID        = $TENANT_ID
#   AZURE_SUBSCRIPTION_ID  = $SUB_ID
# Sem AZURE_CLIENT_ID, o deploy é PULADO (não falha).
#
# Notas:
#  • ACR em modo ABAC (az acr show -n defesacivil --query roleAssignmentMode ==
#    "rbac-abac"): AcrPush não basta — use "Container Registry Repository Writer"
#    + "Container Registry Repository Catalog Lister" e adicione
#    --source-acr-auth-id [caller] nos az acr build.
#  • Deploy a partir de outra branch: crie credenciais federadas adicionais com o
#    subject correspondente (repo:Lca2001C/Defesa-civil:ref:refs/heads/<branch>).
#  • Migrações de banco NÃO rodam aqui (os runners do GitHub não são "serviços do
#    Azure" no firewall do PostgreSQL). Ver docs/DEPLOY-AZURE.md §U.5.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aca-prod
  cancel-in-progress: false

# Necessário para o OIDC (azure/login busca um token federado).
permissions:
  id-token: write
  contents: read

env:
  AZ_RG: rg-dcmg-prod
  ACA_APP: dcmg-app
  ACR_NAME: defesacivil
  ACR_LOGIN_SERVER: defesacivil.azurecr.io

jobs:
  deploy:
    name: Build (ACR) + Deploy (ACA)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar credencial de deploy
        id: guard
        env:
          # Compara sem expor o valor: resulta em "true"/"false".
          HAS_CREDS: ${{ secrets.AZURE_CLIENT_ID != '' }}
        run: |
          echo "ready=${HAS_CREDS}" >> "$GITHUB_OUTPUT"
          if [ "$HAS_CREDS" != "true" ]; then
            echo "::warning::AZURE_CLIENT_ID ausente — deploy no ACA pulado (sem falhar)."
          fi

      - name: Login no Azure (OIDC)
        if: steps.guard.outputs.ready == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Garantir a extensão containerapp
        if: steps.guard.outputs.ready == 'true'
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Build das imagens no ACR (api + web)
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA}"
          echo "Tag do deploy: ${TAG}"
          az acr build --registry "${ACR_NAME}" \
            --image "dcmg-api:${TAG}" --image "dcmg-api:latest" \
            --file infra/docker/api.Dockerfile .
          az acr build --registry "${ACR_NAME}" \
            --image "dcmg-web:${TAG}" --image "dcmg-web:latest" \
            --file infra/docker/web.Dockerfile .

      - name: Deploy — atualiza a imagem de cada container (não toca em config)
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA}"
          az containerapp update \
            --resource-group "${AZ_RG}" --name "${ACA_APP}" \
            --container-name dcmg-api \
            --image "${ACR_LOGIN_SERVER}/dcmg-api:${TAG}"
          az containerapp update \
            --resource-group "${AZ_RG}" --name "${ACA_APP}" \
            --container-name dcmg-web \
            --image "${ACR_LOGIN_SERVER}/dcmg-web:${TAG}"

      - name: Validar (revisões + AcrPull/identidade preservados)
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          az containerapp revision list -g "${AZ_RG}" -n "${ACA_APP}" -o table
          echo "----- identidade dos registries (deve continuar preenchida) -----"
          az containerapp show -g "${AZ_RG}" -n "${ACA_APP}" \
            --query "properties.configuration.registries" -o json
