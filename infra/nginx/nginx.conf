# =============================================================================
# Nginx — serve a SPA (Defesa Civil MG) e atua como proxy reverso da API.
# -----------------------------------------------------------------------------
# Mesma origem para front-end e API (/api), seguindo o principio "build once,
# deploy anywhere": a SPA chama tudo por caminho relativo, sem URL de API
# fixada em tempo de build.
# =============================================================================

server {
    # Porta nao privilegiada: o container web roda como usuario nao-root
    # (nginx-unprivileged). O mapeamento de portas do host fica no compose.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads vão direto ao Azure Blob (SAS). Este limite cobre o caminho legado/local (dev).
    client_max_body_size 60m;

    # ---- Compressao -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- Cabecalhos de seguranca -----------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # CSP conservadora: compatível com a SPA MUI/Emotion (estilos inline). O
    # connect-src libera self (API mesma origem) + Azure Blob (upload/download SAS).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.blob.core.windows.net; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ---- Runtime config (window.__ENV__) ---------------------------------
    # Nunca deve ser cacheado: e regenerado a cada boot do container.
    location = /env.js {
        add_header Cache-Control "no-store" always;
        try_files /env.js =404;
    }

    # ---- API (NestJS) — preserva o prefixo /api --------------------------
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeout generoso para o export de Excel síncrono (streaming na request).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- SPA — fallback de roteamento client-side ------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
