# =============================================================================
# Nginx — configuracao de PRODUCAO (Fase 2) com TLS.
# -----------------------------------------------------------------------------
# Montada pelo docker-compose.prod.yml sobre /etc/nginx/conf.d/default.conf.
# Roda no container nginx-unprivileged (usuario nao-root), por isso escuta em
# portas NAO privilegiadas (8080 HTTP e 8443 HTTPS); o host publica 80->8080 e
# 443->8443.
#
# Certificados (Let's Encrypt/Certbot) montados em /etc/nginx/certs:
#   - fullchain.pem
#   - privkey.pem
# IMPORTANTE: como o Nginx roda nao-root, garanta que privkey.pem seja legivel
# pelo usuario "nginx" (uid 101) — ex.: chown 101 ou grupo com leitura.
# =============================================================================

# ---- HTTP (8080) -> redireciona para HTTPS ----------------------------------
server {
    listen 8080;
    server_name _;
    # Mantem o /env.js acessivel por HTTP caso necessario para health/redirect.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS (8443) -----------------------------------------------------------
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60m;

    # ---- Compressao -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- Cabecalhos de seguranca -----------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # CSP conservadora: compatível com a SPA MUI/Emotion (estilos inline). O
    # connect-src libera self (API mesma origem) + Azure Blob (upload/download SAS).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.blob.core.windows.net; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ---- Runtime config (window.__ENV__) ---------------------------------
    location = /env.js {
        add_header Cache-Control "no-store" always;
        try_files /env.js =404;
    }

    # Assets estaticos devem existir de fato. Sem esta regra, uma imagem
    # ausente como /logo.svg cai no fallback da SPA e recebe index.html.
    location ~* \.(?:css|js|mjs|map|svg|png|jpg|jpeg|gif|webp|ico|json|geojson|woff2?|ttf)$ {
        try_files $uri =404;
        access_log off;
    }

    # ---- API (NestJS) — preserva o prefixo /api --------------------------
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeout generoso para o export de Excel síncrono (streaming na request).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- SPA — fallback de roteamento client-side ------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
