# =============================================================================
# Plataforma Defesa Civil MG — Orquestracao de servicos (DEV / Fase 1)
# -----------------------------------------------------------------------------
# Principio "build once, deploy anywhere": toda a configuracao vem do .env.
# Para producao, aplicar o override: docker-compose.prod.yml
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Banco de dados relacional (PostgreSQL)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Publicar a porta apenas em DEV para inspecao com clientes externos.
    # Em producao esta publicacao e removida pelo override de prod.
    ports:
      - "5436:5432"
    healthcheck:
      # pg_isready confirma que o banco aceita conexoes antes de a API subir.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dcmg

  # ---------------------------------------------------------------------------
  # Cache / fila / adaptador WebSocket (Redis)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # Publicar a porta apenas em DEV. Em producao e removida pelo override.
    ports:
      - "6379:6379"
    healthcheck:
      # redis-cli ping deve responder PONG quando o servico esta saudavel.
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dcmg

  # ---------------------------------------------------------------------------
  # API (NestJS) — escuta na porta 4000, prefixo global /api
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Persistencia dos uploads quando STORAGE_DRIVER=local.
      - uploads:/data/uploads
    ports:
      - "4000:4000"
    healthcheck:
      # O endpoint /api/health e exposto pelo @nestjs/terminus.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dcmg

  # ---------------------------------------------------------------------------
  # Web (Nginx) — serve a SPA e atua como proxy reverso para a API
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      # Variaveis injetadas no /env.js em tempo de boot (runtime config).
      APP_ENV: ${APP_ENV}
      API_BASE_URL: /api
      SOCKET_PATH: /socket.io
    depends_on:
      - api
    # A porta do host vem da variavel NGINX_HTTP_PORT (padrao 8080), mapeada
    # para a porta 8080 do container (Nginx nao-root / nginx-unprivileged).
    ports:
      - "${NGINX_HTTP_PORT:-8080}:8080"
    networks:
      - dcmg

  # ---------------------------------------------------------------------------
  # Ngrok (tunel publico opcional) — ativado pelo profile "tunnel"
  #   docker compose --profile tunnel up ngrok
  # ---------------------------------------------------------------------------
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    profiles:
      - tunnel
    command: ["http", "web:8080"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - web
    networks:
      - dcmg

volumes:
  pg_data:
  redis_data:
  uploads:

networks:
  dcmg:
    driver: bridge
