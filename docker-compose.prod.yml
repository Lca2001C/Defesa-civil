# =============================================================================
# Plataforma Defesa Civil MG — PRODUÇÃO (Azure VM B2s — 2 vCPU / 4 GB)
# -----------------------------------------------------------------------------
# Arquivo STANDALONE (não faz merge com docker-compose.yml). Sobe apenas a API
# e o front (Nginx). O PostgreSQL é GERENCIADO na Azure (Azure Database for
# PostgreSQL Flexible Server) — fora da VM. Cache, filas e WebSocket foram
# removidos (instância única), então não há Redis.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Pré-requisitos no .env:
#   - DATABASE_URL apontando para o Azure (…?sslmode=require)
#   - JWT_ACCESS_SECRET / JWT_REFRESH_SECRET fortes e distintos
#   - CORS_ORIGINS com o domínio público
#   - STORAGE_DRIVER=azure + AZURE_STORAGE_CONNECTION_STRING (anexos no Blob)
#
# Migrações: rodar `pnpm --filter @dcmg/api exec prisma migrate deploy` apontando
# DATABASE_URL para o Azure (passo de deploy, fora do compose).
#
# TLS (Let's Encrypt via Certbot): coloque fullchain.pem e privkey.pem em
#   ./infra/nginx/certs e ajuste nginx.prod.conf.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API (NestJS) — interna; exposta ao mundo apenas via proxy do Nginx (web).
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: production
      NODE_ENV: production
    volumes:
      # Persistência dos uploads quando STORAGE_DRIVER=local (com Azure Blob,
      # os anexos vão para o Blob e este volume guarda apenas temporários).
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "2.5G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    networks:
      - dcmg

  # ---------------------------------------------------------------------------
  # Web (Nginx) — serve a SPA e atua como proxy reverso para a API. TLS.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: always
    environment:
      APP_ENV: production
      API_BASE_URL: /api
    depends_on:
      - api
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "192M"
        reservations:
          cpus: "0.1"
          memory: "64M"
    networks:
      - dcmg

volumes:
  uploads:

networks:
  dcmg:
    driver: bridge
