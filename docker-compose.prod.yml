# =============================================================================
# Plataforma Defesa Civil MG — Override de PRODUÇÃO (Fase 2)
# -----------------------------------------------------------------------------
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Objetivos:
#   - Web publica nas portas 80 e 443 (HTTP/HTTPS).
#   - Monta certificados TLS em ./infra/nginx/certs.
#   - APP_ENV=production; portas internas não publicadas.
#   - Limites de CPU/memória para cada serviço.
#   - Política de reinicialização "always" (sobrepõe "unless-stopped").
#   - Redis com senha e persistência AOF habilitada.
#   - Sem Ngrok (profile "tunnel" não é ativado em prod).
#
# TLS (Let's Encrypt via Certbot):
#   1. docker run --rm -it \
#        -v "$PWD/infra/nginx/certs:/etc/letsencrypt" \
#        -v "$PWD/infra/nginx/certs-www:/var/www/certbot" \
#        certbot/certbot certonly --webroot -w /var/www/certbot \
#        -d defesacivil.mg.gov.br
#   2. Os arquivos fullchain.pem e privkey.pem ficam em ./infra/nginx/certs.
#   3. Renovação: agendar "certbot renew" via cron e
#      docker compose exec web nginx -s reload
# =============================================================================

services:
  postgres:
    restart: always
    # Em produção NÃO publicamos a porta do banco para o host.
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Parâmetros de performance recomendados para produção
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=pt_BR.UTF-8"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "256M"
    # Configurações extras de segurança para o PostgreSQL
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c log_connections=on
        -c log_disconnections=on
        -c log_min_duration_statement=1000
        -c max_connections=100

  redis:
    restart: always
    ports: !reset []
    # Redis com senha e persistência AOF para durabilidade em produção
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-troque-esta-senha-redis}
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "384M"
        reservations:
          cpus: "0.1"
          memory: "128M"

  api:
    restart: always
    environment:
      APP_ENV: production
      NODE_ENV: production
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "256M"

  web:
    restart: always
    environment:
      APP_ENV: production
      API_BASE_URL: /api
      SOCKET_PATH: /socket.io
    ports: !reset
      - "80:8080"
      - "443:8443"
    volumes:
      # Configuração de produção com TLS (sobrepõe a conf padrão da imagem).
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificados TLS montados como somente-leitura dentro do container.
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"
        reservations:
          cpus: "0.1"
          memory: "64M"
