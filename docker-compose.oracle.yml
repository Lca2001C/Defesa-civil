# =============================================================================
# Plataforma Defesa Civil MG — PRODUÇÃO no Oracle Cloud (Always Free)
# -----------------------------------------------------------------------------
# Diferente do Azure (banco gerenciado), o OCI Always Free NÃO oferece
# PostgreSQL gerenciado gratuito — então aqui o Postgres roda na PRÓPRIA VM
# (a Ampere A1 free tem RAM de sobra). Anexos em disco local (block volume).
#
# Arquivo STANDALONE — NÃO faz merge com docker-compose.yml. Builda as imagens
# na própria VM (ARM64 nativo), sem registry.
#
# Uso (na raiz do repositório, dentro da VM):
#   docker compose -f docker-compose.oracle.yml up -d --build
#
# Pré-requisitos no .env:
#   - POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB (banco local)
#   - JWT_ACCESS_SECRET / JWT_REFRESH_SECRET (fortes e distintos, >=32)
#   - CORS_ORIGINS com o domínio público
#   - STORAGE_DRIVER=local  (anexos no volume `uploads`)
# (DATABASE_URL é sobrescrita abaixo para a rede interna do compose.)
#
# Migrations: docker compose -f docker-compose.oracle.yml exec -T -w /app/apps/api \
#   api /app/node_modules/.bin/prisma migrate deploy
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — na própria VM (dados persistidos em volume)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Tuning enxuto para VM pequena. Aumente em VMs A1 maiores (2-4 OCPU).
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1.5G"
        reservations:
          memory: "256M"
    networks:
      - dcmg

  # ---------------------------------------------------------------------------
  # API (NestJS) — interna; exposta só via proxy do Nginx
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: production
      NODE_ENV: production
      # DSN para a rede interna do compose (precede o valor do .env).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Heap do V8 dimensionado para a VM MÍNIMA (1 OCPU / 6 GB) com Postgres
      # na mesma máquina. Em A1 maiores (12-24 GB), pode subir para 1536/2048.
      NODE_OPTIONS: "--max-old-space-size=1024"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "2.5G"
        reservations:
          memory: "512M"
    networks:
      - dcmg

  # ---------------------------------------------------------------------------
  # Web (Nginx) — SPA + proxy reverso + TLS
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: always
    environment:
      APP_ENV: production
      API_BASE_URL: /api
    depends_on:
      - api
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "192M"
        reservations:
          memory: "64M"
    networks:
      - dcmg

volumes:
  pg_data:
  uploads:

networks:
  dcmg:
    driver: bridge
