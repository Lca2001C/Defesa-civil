<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- fundo circular -->
  <circle cx="50" cy="50" r="48" fill="#e8e8e8"/>
  <circle cx="50" cy="50" r="48" fill="url(#sombra)" opacity="0.18"/>
  <defs>
    <radialGradient id="sombra" cx="60%" cy="40%">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#888" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!--
    Hexágono regular com vértice no topo, dividido em 6 triângulos a partir do centro.
    Vértices (raio 38, centro 50,50):
      0: topo        ( 50.0,  12.0 )
      1: topo-dir    ( 82.9,  31.0 )
      2: baixo-dir   ( 82.9,  69.0 )
      3: baixo       ( 50.0,  88.0 )
      4: baixo-esq   ( 17.1,  69.0 )
      5: topo-esq    ( 17.1,  31.0 )
    Centro: (50, 50)
  -->

  <!-- triângulo superior (0→1) — laranja -->
  <polygon points="50,50 50,12 82.9,31" fill="#F97316"/>
  <!-- triângulo direita-cima (1→2) — laranja -->
  <polygon points="50,50 82.9,31 82.9,69" fill="#F97316"/>
  <!-- triângulo direita-baixo (2→3) — laranja -->
  <polygon points="50,50 82.9,69 50,88" fill="#F97316"/>
  <!-- triângulo inferior (3→4) — VERMELHO (símbolo Defesa Civil) -->
  <polygon points="50,50 50,88 17.1,69" fill="#CC2222"/>
  <!-- triângulo esquerda-baixo (4→5) — laranja -->
  <polygon points="50,50 17.1,69 17.1,31" fill="#F97316"/>
  <!-- triângulo esquerda-cima (5→0) — laranja -->
  <polygon points="50,50 17.1,31 50,12" fill="#F97316"/>

  <!-- linhas divisórias brancas -->
  <line x1="50" y1="50" x2="50"  y2="12"   stroke="white" stroke-width="1.8"/>
  <line x1="50" y1="50" x2="82.9" y2="31"  stroke="white" stroke-width="1.8"/>
  <line x1="50" y1="50" x2="82.9" y2="69"  stroke="white" stroke-width="1.8"/>
  <line x1="50" y1="50" x2="50"  y2="88"   stroke="white" stroke-width="1.8"/>
  <line x1="50" y1="50" x2="17.1" y2="69"  stroke="white" stroke-width="1.8"/>
  <line x1="50" y1="50" x2="17.1" y2="31"  stroke="white" stroke-width="1.8"/>
  <!-- borda do hexágono -->
  <polygon points="50,12 82.9,31 82.9,69 50,88 17.1,69 17.1,31"
           fill="none" stroke="white" stroke-width="1.8"/>
</svg>
